version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: xtest-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-xtest_db}
      MYSQL_USER: ${DB_USER:-xtest_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-xtest_password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backups:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - xtest-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xtest-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-xtest_user}
      - DB_PASSWORD=${DB_PASSWORD:-xtest_password}
      - DB_NAME=${DB_NAME:-xtest_db}
      - JWT_SECRET=${JWT_SECRET:-change_this_secret_in_production}
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_DIR=/app/logs
      - LOG_CONSOLE=${LOG_CONSOLE:-true}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - app_logs:/app/logs
      - app_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - xtest-network

volumes:
  mysql_data:
    driver: local
  app_logs:
    driver: local
  app_uploads:
    driver: local

networks:
  xtest-network:
    driver: bridge
